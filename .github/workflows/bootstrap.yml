name: One-time foundation bootstrap

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand project snapshot
        run: |
          cat .bootstrap/part-*.b64 > /tmp/palette-paper.b64
          test "$(wc -c < /tmp/palette-paper.b64)" -eq 13148
          base64 -d /tmp/palette-paper.b64 > /tmp/palette-paper.tar.gz
          echo "d2051d3f871370654dcd49128b82dbcc21b846f290026d90933fa3ddb5aeb519  /tmp/palette-paper.tar.gz" | sha256sum -c -
          tar -xzf /tmp/palette-paper.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: establish technical foundation"
          git push origin HEAD:main
